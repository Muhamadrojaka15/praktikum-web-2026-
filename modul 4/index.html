<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Portfolio Tracker - Modul 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 30px 15px; }
    .container { max-width: 800px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { color: #64748b; margin-bottom: 20px; font-size: 14px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center; }
    .stat-card h3 { font-size: 13px; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card p { font-size: 20px; font-weight: bold; color: #1e3a8a; }

    .project-form { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 25px; }
    .project-form h2 { font-size: 16px; color: #1e3a8a; margin-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 13px; font-weight: 600; color: #334155; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group select {
      padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: #ffffff;
    }
    .form-group input:focus, .form-group select:focus, .search-input:focus { outline: 2px solid #1e3a8a; outline-offset: 1px; }
    .form-group.invalid input { border-color: #dc2626; }
    .error-msg { color: #dc2626; font-size: 12px; min-height: 14px; }
    .checkbox-row { flex-direction: row; align-items: center; gap: 8px; }
    .checkbox-row label { font-weight: 500; }
    .btn-submit { padding: 10px 18px; background: #1e3a8a; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; justify-self: start; }
    .btn-submit:hover { background: #172554; }

    .search-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
    .filter-group { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn-filter { padding: 8px 16px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn-filter.active, .btn-filter:hover { background: #1e3a8a; color: #ffffff; border-color: #1e3a8a; }

    .project-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #ffffff; transition: transform 0.15s ease; }
    .project-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .project-info h4 { font-size: 16px; color: #0f172a; margin-bottom: 4px; }
    .project-category { display: inline-block; font-size: 12px; color: #0284c7; background: #e0f2fe; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; font-weight: 600; }
    .project-budget { font-size: 14px; color: #334155; font-weight: 600; }
    .project-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .card-actions { display: flex; gap: 6px; }
    .btn-action { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1; background: #ffffff; color: #1e3a8a; }
    .btn-action:hover { background: #eff6ff; }
    .btn-delete { color: #b91c1c; border-color: #fecaca; }
    .btn-delete:hover { background: #fef2f2; }
    .empty-state { text-align: center; color: #64748b; padding: 20px; }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .project-card { flex-direction: column; align-items: flex-start; }
      .project-side { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Portfolio Tracker</h1>
    <p class="subtitle">Tambah, cari, ubah status, dan hapus proyek portofolio Anda.</p>

    <!-- Kartu Ringkasan Statistik -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Proyek</h3>
        <p id="stat-total-projects">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Anggaran</h3>
        <p id="stat-total-budget">Rp 0</p>
      </div>
      <div class="stat-card">
        <h3>Selesai Dikerjakan</h3>
        <p id="stat-completed-projects">0</p>
      </div>
    </div>

    <form id="project-form" class="project-form" novalidate>
      <h2>Tambah proyek baru</h2>
      <div class="form-grid">
        <div class="form-group full" id="group-title">
          <label for="input-title">Judul proyek</label>
          <input type="text" id="input-title" placeholder="Contoh: Website Toko Online">
          <span class="error-msg" id="error-title"></span>
        </div>
        <div class="form-group">
          <label for="input-category">Kategori</label>
          <select id="input-category">
            <option value="Web App">Web App</option>
            <option value="Mobile App">Mobile App</option>
            <option value="Desktop App">Desktop App</option>
            <option value="UI/UX Design">UI/UX Design</option>
          </select>
        </div>
        <div class="form-group" id="group-budget">
          <label for="input-budget">Estimasi anggaran (Rp)</label>
          <input type="number" id="input-budget" placeholder="2500000" min="0">
          <span class="error-msg" id="error-budget"></span>
        </div>
        <div class="form-group full checkbox-row">
          <input type="checkbox" id="input-completed">
          <label for="input-completed">Sudah selesai</label>
        </div>
        <button type="submit" class="btn-submit">Simpan proyek</button>
      </div>
    </form>

    <!-- Fitur 2: Pencarian Real-Time -->
    <input type="search" id="search-input" class="search-input" placeholder="Cari proyek berdasarkan judul..." aria-label="Cari proyek">

    <!-- Filter Kategori -->
    <div class="filter-group">
      <button class="btn-filter active" data-category="Semua">Semua Proyek</button>
      <button class="btn-filter" data-category="Web App">Web App</button>
      <button class="btn-filter" data-category="Desktop App">Desktop App</button>
      <button class="btn-filter" data-category="Mobile App">Mobile App</button>
      <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
    </div>

    <!-- Kontainer Daftar Proyek -->
    <div id="project-list"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
